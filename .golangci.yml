---
version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        # only called from the csi-addons tool
        - fmt.Fprintln
  exclusions:
    rules:
      # Ginkgo/Gomega convention: dot-import for matchers in large replication E2E helpers.
      - path: test/e2e/replication/helpers\.go
        text: "ST1001"
        linters:
          - staticcheck
